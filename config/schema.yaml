---
dataset_id:
  type: 'String'
  required: true
  help: 'Dataset identifier'
input_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,fraction_id,path columns and one Bruker .d directory per row'
diatracer_executable:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Path to a separately obtained diaTracer JAR'
bruker_lib_dir:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Path to the MSFragger ext/bruker directory with libtimsdata-2-21-0-4.so'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Absolute path to output directory'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow working directory with enough space to copy each .d input'
fragpipe_docker_repo:
  type: 'String'
  required: false
  help: 'FragPipe Docker repository without a version tag'
fragpipe_version:
  type: 'String'
  required: false
  help: 'FragPipe Docker image version tag'
docker_image_fragpipe:
  type: 'String'
  required: false
  help: 'FragPipe container image containing Java and Bruker libraries'
diatracer_write_inter:
  type: 'Number'
  choices: [0, 1]
  required: false
diatracer_delta_apex_im:
  type: 'Number'
  required: false
diatracer_delta_apex_rt:
  type: 'Number'
  required: false
diatracer_ms1_ms2_corr:
  type: 'Number'
  required: false
diatracer_mass_defect_filter:
  type: 'Number'
  choices: [0, 1]
  required: false
diatracer_mass_defect_offset:
  type: 'Number'
  required: false
diatracer_rf_max:
  type: 'Number'
  required: false
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
    cpus:
      type: 'ResourceUpdateList'
      required: false
